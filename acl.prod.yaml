# hindsight-auth-proxy ACL
# Updated: 2026-07-31 — add tagged agent hostname agent-product-assistant → user-sleiman
# Project: ai-memory / service: hindsight-auth-proxy (NOT product-brain)
#
# Bank id glob patterns use Go path.Match syntax.
# Default deny: identity with no matching pattern → 403.
# Humans = Tailscale login email; tagged agents = short tailnet hostname.
# Reload: update ACL_YAML_CONTENT and redeploy.

admins:
  - richard@brickeye.com        # full access incl. unscoped paths

shared:                          # every authenticated tailnet user
  - org-*

teams:
  # Engineering — Software
  sw:
    banks: [team-sw, team-sw-*]
    members:
      - timw@brickeye.com

  # Engineering — R&D
  rnd:
    banks: [team-rnd, team-rnd-*]
    members: []

  # Engineering — Hardware
  hw:
    banks: [team-hw, team-hw-*]
    members:
      - jessica@brickeye.com

  # Product
  product:
    banks: [team-product, team-product-*]
    members:
      - sleiman@brickeye.com

  # Executives
  exec:
    banks: [team-exec, team-exec-*]
    members:
      - richard@brickeye.com

  # Finance
  fin:
    banks: [team-fin, team-fin-*]
    members: []

users:
  richard@brickeye.com:
    banks: [user-richard]
  jessica@brickeye.com:
    banks: [user-jessica]
  timw@brickeye.com:
    banks: [user-timw]
  sleiman@brickeye.com:
    banks: [user-sleiman]
  david@brickeye.com:
    banks: [user-david]
  # Tagged Hermes node (WhoIs → hostname, not email / not tags)
  # Grant both role-default bank and any secrets-file override used in bootstrap tests.
  agent-product-assistant:
    banks: [user-sleiman, agent-product-assistant]
  # Hardware department Hermes node — native memory bank (agent identity)
  # + david's personal bank (default profile serves David personally,
  # mirrors agent-product-assistant's user-sleiman split).
  agent-hardware-assistant:
    banks: [agent-hardware-assistant, user-david]
